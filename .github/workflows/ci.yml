name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  NPM_VERSION: '11.6.2'
  NODE_OPTIONS: '--max-old-space-size=6144'

jobs:
  relay-container:
    name: Verify production relay container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Build isolated relay image
        run: docker build --file packages/orkestrai-relay/Dockerfile --tag orkestrai-relay:ci .

      - name: Verify both public relay protocols
        run: |
          set -euo pipefail
          trap 'docker rm -f orkestrai-relay-ci >/dev/null 2>&1 || true' EXIT
          docker run --detach --rm --name orkestrai-relay-ci --publish 127.0.0.1:18787:8787 orkestrai-relay:ci
          for attempt in $(seq 1 20); do
            echo "Checking relay readiness ($attempt/20)"
            if curl --fail --silent http://127.0.0.1:18787/health > "$RUNNER_TEMP/relay-health.json"; then
              node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; const h=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); assert.equal(h.ok,true); for (const p of ['orkestrai-collaboration.v1','orkestrai-inference.v1']) assert.ok(h.protocols.includes(p));" "$RUNNER_TEMP/relay-health.json"
              exit 0
            fi
            sleep 1
          done
          docker logs orkestrai-relay-ci
          exit 1

  windows-native:
    name: Verify Windows desktop transport
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Diagnose Windows PowerShell startup
        run: node scripts/diagnose-computer-windows.mjs

      - name: Install dependencies
        run: |
          npm install --global "npm@${{ env.NPM_VERSION }}"
          npm ci --no-audit --no-fund

      - name: Verify native desktop command transport
        run: npm test -- --run tests/unit/computer-native-adapters.test.ts tests/unit/computer-native-runner.test.ts tests/unit/knowledge-extraction.test.ts tests/unit/knowledge-runtime.test.ts tests/unit/production-bundle.test.ts tests/unit/orkestrai-cli-inbox.test.ts tests/unit/agent-terminal-delivery.test.ts tests/unit/agent-transcript.test.ts tests/unit/transcript-team-throughput.test.ts tests/unit/queue-health-check.test.ts tests/unit/zod-size-validation.test.ts tests/unit/electron-adventure-window.test.ts tests/unit/agent-path.test.ts tests/unit/package-ripgrep-runtime.test.ts

      - name: Verify Windows workspace startup under slow filesystem probes
        run: npm test -- --run tests/feature/role-service.test.ts tests/unit/pty-ws.test.ts tests/unit/codex-mcp-config.test.ts --testNamePattern "loads and materializes|shares a slow catalog|keeps both viewers connected|canonicalizes only native trust" --maxWorkers=2 --testTimeout=20000

      - name: Verify bounded workspace files and snapshot policies on Windows
        run: npm test -- --run tests/unit/floor-snapshot-policy.test.ts tests/unit/bridge-git-exclude.test.ts tests/unit/workspace-text-file.test.ts tests/unit/code-graph-source-policy.test.ts tests/feature/workspace-folder-availability.test.ts --maxWorkers=2 --testTimeout=20000

      - name: Verify native Git Floor snapshot containment on Windows
        run: npm test -- --run tests/feature/floor-service.test.ts --testNamePattern "tracked internal state|untracked internal data|selected checkout has a .git file|preserves tracked roles|new portable definitions|branch with portable definitions|workspace points at a subdirectory|modified tracked bytes relative|tracked checkout size" --maxWorkers=2 --testTimeout=20000

      - name: Verify responsive asset workspaces without Code Intelligence
        run: npm test -- --run tests/feature/workspace-filesystem-responsiveness.test.ts tests/feature/filesystem-git.test.ts tests/unit/git-process-queue.test.ts --maxWorkers=2 --testTimeout=20000

      - name: Verify repeated and concurrent native Portal screenshots
        id: portal_capture
        run: node scripts/run-electron-lifecycle.mjs scripts/test-portal-capture-lifecycle.cjs

      - name: Verify terminal renderer backpressure and collection
        if: ${{ !cancelled() && steps.portal_capture.outcome != 'skipped' }}
        run: node scripts/run-electron-lifecycle.mjs scripts/test-terminal-renderer-lifecycle.cjs

  verify:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: |
          npm install --global "npm@$NPM_VERSION"
          npm ci --no-audit --no-fund

      - name: Audit all dependencies
        run: npm audit --audit-level=moderate

      - name: Install Electron runtime libraries for offline OCR tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0t64 libnss3 libasound2t64 libgbm1 xvfb

      - name: Verify offline OCR without competing test workers
        run: npm test -- --maxWorkers=1 tests/unit/knowledge-runtime.test.ts

      - name: Verify repeated and concurrent native Portal screenshots
        id: portal_capture
        run: xvfb-run -a node scripts/run-electron-lifecycle.mjs scripts/test-portal-capture-lifecycle.cjs --software

      - name: Verify terminal renderer backpressure and collection
        if: ${{ !cancelled() && steps.portal_capture.outcome != 'skipped' }}
        run: xvfb-run -a node scripts/run-electron-lifecycle.mjs scripts/test-terminal-renderer-lifecycle.cjs

      - name: Run tests
        run: npm test -- --maxWorkers=2 --exclude tests/unit/knowledge-runtime.test.ts

      - name: Build production application
        run: npm run build

      - name: Verify production upgrade from the reported legacy schema
        timeout-minutes: 5
        run: node scripts/run-packaged-startup-smoke.mjs .

      - name: Stamp browser-test candidate
        run: node scripts/production-bundle.mjs stamp build "$GITHUB_SHA"

      - name: Upload browser-test candidate
        uses: actions/upload-artifact@v7
        with:
          name: browser-candidate-${{ github.sha }}
          overwrite: true
          path: build/
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true

  browser-tests:
    name: Browser tests (${{ matrix.shard }}/4)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies and generate test modules
        run: |
          npm install --global "npm@$NPM_VERSION"
          npm ci --no-audit --no-fund
          npm run test:prepare

      - name: Download browser-test candidate
        uses: actions/download-artifact@v8
        with:
          name: browser-candidate-${{ github.sha }}
          path: build/
          digest-mismatch: error

      - name: Verify candidate source and file hashes
        run: node scripts/production-bundle.mjs verify build "$GITHUB_SHA"

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Verify leadership and terminal interactions
        if: matrix.shard == 1
        id: interaction_tests
        timeout-minutes: 5
        run: npm run test:e2e -- tests/e2e/agent-create.spec.ts tests/e2e/workspace-leadership.spec.ts tests/e2e/terminal.spec.ts --grep 'desenhar terminal|transfers leadership|copia a selecao' --reporter=line,github --max-failures=1 --workers=1

      - name: Run end-to-end tests
        id: browser_tests
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4 --workers=1 --reporter=line,github --max-failures=3

      - name: Upload Playwright failure artifacts
        if: always() && (steps.interaction_tests.outcome == 'failure' || (steps.browser_tests.outcome != 'success' && steps.browser_tests.outcome != 'skipped'))
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failures-${{ github.sha }}-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  production-bundle:
    name: Publish tested production bundle
    needs: [verify, browser-tests, windows-native, relay-container, secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download verified browser-test candidate
        uses: actions/download-artifact@v8
        with:
          name: browser-candidate-${{ github.sha }}
          path: build/
          digest-mismatch: error

      - name: Verify tested source and unchanged file hashes
        run: node scripts/production-bundle.mjs verify build "$GITHUB_SHA"

      - name: Upload tested production bundle
        uses: actions/upload-artifact@v7
        with:
          name: production-build-${{ github.sha }}
          overwrite: true
          path: build/
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true

  secrets:
    name: Scan Git history for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Scan repository
        run: |
          "$(go env GOPATH)/bin/gitleaks" git --redact=100 .
