name: Windows Codex delivery soak

on:
  workflow_call:
    inputs:
      soak_seconds:
        default: '3900'
        type: string
  workflow_dispatch:
    inputs:
      soak_seconds:
        description: Real TUI exercise duration (3900 verifies the reported one-hour boundary)
        default: '3900'
        type: string

permissions:
  contents: read

jobs:
  codex-conpty:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        codex_version: ['0.166.0', '0.167.0']
    timeout-minutes: 85
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      ORKESTRAI_REAL_CODEX_TEST: '1'
      ORKESTRAI_CODEX_SOAK_SECONDS: ${{ inputs.soak_seconds }}
      # Keep one Canvas session alive across the reported one-hour boundary.
      # Other scenarios still run; three 65-minute runs exceed the job budget.
      ORKESTRAI_CODEX_SOAK_SCENARIO: 'canvas'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install isolated test dependencies
        run: |
          npm install --global npm@11.6.2
          npm ci --no-audit --no-fund
      - name: Download pinned official Codex CLI
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'codex-fixture.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'codex-fixture'
          $expectedVersion = '${{ matrix.codex_version }}'
          Invoke-WebRequest "https://github.com/openai/codex/releases/download/rust-v$expectedVersion/codex-x86_64-pc-windows-msvc.exe.zip" -OutFile $archive -MaximumRetryCount 3 -RetryIntervalSec 2 -TimeoutSec 120
          $digest = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedDigest = if ($expectedVersion -eq '0.166.0') { 'bf67d9662ed539f305849b74ad6420cc7b23aa2be07753710ca3db9134a0246d' } else { '94b51ca84648a6923784ef71f06e2feb1e10796ddb3f5d033ccb0fbe8daa2f16' }
          if ($digest -ne $expectedDigest) { throw 'Codex archive digest mismatch' }
          Expand-Archive $archive -DestinationPath $destination
          $binaries = @(Get-ChildItem $destination -Recurse -File | Where-Object { $_.Name -in @('codex.exe', 'codex-x86_64-pc-windows-msvc.exe') })
          if ($binaries.Count -ne 1) { throw 'Missing or ambiguous official Codex TUI executable' }
          $binary = $binaries[0]
          $version = & $binary.FullName --version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch ('^codex-cli ' + [regex]::Escape($expectedVersion))) { throw 'Unexpected Codex TUI executable/version' }
          "ORKESTRAI_TEST_CODEX_BINARY=$($binary.FullName)" >> $env:GITHUB_ENV
      - name: Check Windows recovery guards
        run: npm test -- --run tests/unit/pty-input-ownership.test.ts tests/unit/codex-paste-submit.test.ts tests/unit/terminal-replay-queries.test.ts tests/unit/pty-terminal-modes.test.ts tests/unit/learning-delivery-budget.test.ts tests/unit/terminal-output-buffer.test.ts tests/feature/task-dispatch-latency.test.ts tests/unit/interactive-startup.test.ts tests/unit/agent-terminal-delivery.test.ts tests/unit/transcript-listing-single-flight.test.ts tests/unit/pty-packaged-imports.test.ts tests/unit/agent-mid-turn-delivery.test.ts --maxWorkers=2 --testTimeout=20000
      - name: Exercise real Codex over native ConPTY with loopback-only model responses
        shell: pwsh
        run: |
          npm test -- --run tests/feature/codex-tui-delivery.test.ts tests/feature/codex-tui-canvas-submit.test.ts tests/feature/codex-tui-inbox.test.ts tests/feature/codex-tui-mid-turn.test.ts --maxWorkers=1 2>&1 | Tee-Object -FilePath windows-codex-soak.log
          if ($LASTEXITCODE -ne 0) { throw 'Real Codex TUI delivery failed' }
      - name: Install real terminal viewer
        run: npx playwright install chromium
      - name: Exercise browser mouse and duplicate cursor reports with real Codex
        shell: pwsh
        run: |
          $env:ORKESTRAI_REAL_CODEX_BROWSER_TEST = '1'
          $env:ORKESTRAI_CODEX_SOAK_SECONDS = '0'
          npm test -- --run tests/feature/codex-tui-canvas-submit.test.ts --maxWorkers=1 2>&1 | Tee-Object -FilePath windows-codex-browser.log
          if ($LASTEXITCODE -ne 0) { throw 'Browser-to-ConPTY Codex delivery failed' }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-codex-soak-log-${{ matrix.codex_version }}
          path: |
            windows-codex-soak.log
            windows-codex-browser.log
          retention-days: 7
