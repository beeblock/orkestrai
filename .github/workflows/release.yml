name: Release Desktop

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example, v0.1.0)
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: desktop-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  NPM_VERSION: '11.6.2'
  NODE_OPTIONS: '--max-old-space-size=6144'
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Match tag and package version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must use vMAJOR.MINOR.PATCH"
            exit 1
          fi

          VERSION="${RELEASE_TAG#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "::error::Tag $RELEASE_TAG does not match package version $PACKAGE_VERSION"
            exit 1
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Require successful CI for tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          DEADLINE=$((SECONDS + 1800))

          while (( SECONDS < DEADLINE )); do
            RUN="$(gh api \
              --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f head_sha="$SHA" \
              -f event=push \
              -f per_page=10 \
              --jq '[.workflow_runs[] | select(.head_branch == "main")] | sort_by(.run_number) | last // {}')"
            STATUS="$(jq -r '.status // "missing"' <<<"$RUN")"
            CONCLUSION="$(jq -r '.conclusion // ""' <<<"$RUN")"
            URL="$(jq -r '.html_url // ""' <<<"$RUN")"

            if [[ "$STATUS" == "completed" ]]; then
              if [[ "$CONCLUSION" == "success" ]]; then
                echo "CI passed for $SHA: $URL"
                exit 0
              fi
              echo "::error::CI for tagged commit $SHA concluded with '$CONCLUSION': $URL"
              exit 1
            fi

            echo "Waiting for CI on $SHA (status: $STATUS)..."
            sleep 15
          done

          echo "::error::Timed out waiting for CI on tagged commit $SHA"
          exit 1

  build-macos:
    name: Build macOS (Apple Silicon + Intel)
    needs: validate
    runs-on: macos-15
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache Electron downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: macos-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: macos-electron-

      - name: Install dependencies
        run: |
          npm install --global "npm@$NPM_VERSION"
          npm ci --no-audit --no-fund

      - name: Build application
        run: npm run build

      - name: Package macOS installers
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ORKESTRAI_REQUIRE_MAC_SIGNING: 'true'
        run: scripts/package-macos.sh --arm64 --x64

      - name: Verify macOS packages
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          verify_trusted_app() {
            local app="$1"
            local signature

            codesign --verify --deep --strict --verbose=4 "$app"
            signature="$(codesign -dv --verbose=4 "$app" 2>&1)"
            grep -Fq 'Authority=Developer ID Application:' <<<"$signature"
            grep -Fq "TeamIdentifier=$APPLE_TEAM_ID" <<<"$signature"
            grep -Eq 'flags=.*\(runtime\)' <<<"$signature"
            spctl --assess --type execute --verbose=4 "$app"
            xcrun stapler validate "$app"
          }

          test -f release/mac-arm64/Orkestrai.app/Contents/Resources/app/node_modules/electron-updater/package.json
          test -f release/mac/Orkestrai.app/Contents/Resources/app/node_modules/electron-updater/package.json
          verify_trusted_app release/mac-arm64/Orkestrai.app
          verify_trusted_app release/mac/Orkestrai.app
          hdiutil verify release/Orkestrai-${{ needs.validate.outputs.version }}-arm64.dmg
          hdiutil verify release/Orkestrai-${{ needs.validate.outputs.version }}.dmg
          unzip -tq release/Orkestrai-${{ needs.validate.outputs.version }}-arm64-mac.zip
          unzip -tq release/Orkestrai-${{ needs.validate.outputs.version }}-mac.zip

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          retention-days: 7
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.dmg.blockmap
            release/*-mac.zip
            release/*-mac.zip.blockmap
            release/latest-mac.yml

  build-windows:
    name: Build Windows (x64)
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache Electron downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: windows-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: windows-electron-

      - name: Install dependencies
        shell: pwsh
        run: |
          npm install --global npm@$env:NPM_VERSION
          npm ci --no-audit --no-fund

      - name: Build application
        run: npm run build

      - name: Rebuild Electron native dependency
        run: npm run electron:rebuild

      - name: Package Windows installer
        shell: pwsh
        run: npx electron-builder --win nsis --x64 --publish never "-c.npmRebuild=false"

      - name: Verify updater is packaged
        shell: pwsh
        run: |
          if (-not (Test-Path "release/win-unpacked/resources/app/node_modules/electron-updater/package.json")) {
            throw "electron-updater is missing from the packaged Windows application"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          retention-days: 7
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml

  build-linux:
    name: Build Linux (x64)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache Electron downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: linux-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: linux-electron-

      - name: Install dependencies
        run: |
          npm install --global "npm@$NPM_VERSION"
          npm ci --no-audit --no-fund

      - name: Build application
        run: npm run build

      - name: Install RPM build tools
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Package Linux installers
        run: npx electron-builder --linux AppImage rpm --x64 --publish never

      - name: Verify updater is packaged
        run: test -f release/linux-unpacked/resources/app/node_modules/electron-updater/package.json

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-linux
          retention-days: 7
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.rpm
            release/latest-linux.yml

  publish:
    name: Publish verified release
    needs: [validate, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install release validator dependencies
        run: |
          npm install --global "npm@$NPM_VERSION"
          npm ci --no-audit --no-fund --ignore-scripts

      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Validate installers and update manifests
        run: node scripts/validate-release-artifacts.mjs release "${{ needs.validate.outputs.version }}"

      - name: Prepare release notes
        run: node scripts/release-notes.mjs "${{ needs.validate.outputs.version }}" CHANGELOG.md "$RUNNER_TEMP/release-notes.md"

      - name: Publish verified release
        env:
          MAIN_TOKEN: ${{ github.token }}
          LEGACY_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        shell: bash
        run: |
          set -euo pipefail
          LOCAL_COUNT="$(find release -maxdepth 1 -type f | wc -l | tr -d ' ')"
          MAIN_REPOSITORY="beeblock/orkestrai"
          LEGACY_REPOSITORY="beeblock/orkestrai-releases"
          LEGACY_TRANSITION_VERSION="0.1.4"

          prepare_release() {
            local repository="$1"
            local token="$2"
            local target_mode="$3"
            export GH_TOKEN="$token"

            if gh release view "$TAG" --repo "$repository" >/dev/null 2>&1; then
              local is_draft
              is_draft="$(gh release view "$TAG" --repo "$repository" --json isDraft --jq .isDraft)"
              if [[ "$is_draft" != "true" ]]; then
                local published_count
                published_count="$(gh release view "$TAG" --repo "$repository" --json assets --jq '.assets | length')"
                if [[ "$LOCAL_COUNT" != "$published_count" ]]; then
                  echo "::error::Published release $repository@$TAG is immutable and has an unexpected asset count"
                  exit 1
                fi
                return
              fi
              gh release edit "$TAG" --repo "$repository" --title "Orkestrai $VERSION" --notes-file "$NOTES_FILE"
            elif [[ "$target_mode" == "existing-tag" ]]; then
              gh release create "$TAG" --repo "$repository" --verify-tag --draft \
                --title "Orkestrai $VERSION" --notes-file "$NOTES_FILE"
            else
              gh release create "$TAG" --repo "$repository" --target main --draft \
                --title "Orkestrai $VERSION" --notes-file "$NOTES_FILE"
            fi

            gh release upload "$TAG" release/* --repo "$repository" --clobber

            local remote_count
            remote_count="$(gh release view "$TAG" --repo "$repository" --json assets --jq '.assets | length')"
            if [[ "$LOCAL_COUNT" != "$remote_count" ]]; then
              echo "::error::Release asset count mismatch for $repository: local=$LOCAL_COUNT remote=$remote_count"
              exit 1
            fi
          }

          publish_release() {
            local repository="$1"
            local token="$2"
            export GH_TOKEN="$token"
            if [[ "$(gh release view "$TAG" --repo "$repository" --json isDraft --jq .isDraft)" == "true" ]]; then
              gh release edit "$TAG" --repo "$repository" --draft=false --latest
            fi
            gh release view "$TAG" --repo "$repository" --json url --jq .url
          }

          prepare_release "$MAIN_REPOSITORY" "$MAIN_TOKEN" existing-tag

          if [[ "$VERSION" == "$LEGACY_TRANSITION_VERSION" ]]; then
            if [[ -z "$LEGACY_TOKEN" ]]; then
              echo "::error::Missing RELEASES_TOKEN secret required for the $LEGACY_TRANSITION_VERSION transition"
              exit 1
            fi
            prepare_release "$LEGACY_REPOSITORY" "$LEGACY_TOKEN" legacy-tag
            publish_release "$LEGACY_REPOSITORY" "$LEGACY_TOKEN"
          fi

          publish_release "$MAIN_REPOSITORY" "$MAIN_TOKEN"
