title = "Orkestrai secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Kimi Code uses this public OAuth client identifier."
targetRules = ["generic-api-key"]
regexTarget = "match"
regexes = ['''17e5f671-d194-4dfb-9706-5516cb48c098''']

[[allowlists]]
description = "Historical documentation used an explicit placeholder API key."
targetRules = ["curl-auth-header"]
regexTarget = "line"
regexes = ['''sk_your_key_here''']

[[allowlists]]
description = "Synthetic SecretRef handle in MCP contract tests, not a credential."
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^tests/unit/mcp-server\.test\.ts$''']
regexTarget = "match"
regexes = ['''secretref:0123456789abcdef''']

[[allowlists]]
description = "Public video CDN hostname after googleapis triggers the generic API-key heuristic."
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^src/lib/modules/creative-media/infrastructure/providers/FalVideoProvider\.ts$''']
regexTarget = "secret"
regexes = ['''^cdn3\.pixelcut\.app$''']
